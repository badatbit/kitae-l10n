[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitae"
version = "0.1.0"
description = "北へ。White Illumination 다국어화 파이프라인 (unpack/extract/build/font 도구 모음)"
requires-python = ">=3.9"
# Pillow: 글리프·이미지 변환 / numpy: SOZ 텍스처 패킹·이미지 배열 /
# capstone: SH-4 역어셈블 — 빌드가 스텁 기계어를 되읽어 검증한다(kitae/build/sh4.py::assemble)
dependencies = ["Pillow", "numpy", "capstone"]

[project.optional-dependencies]
# 배포 파일 만들기(tools/make_release.py 의 .xdelta)
release = ["pyxdelta"]

[project.scripts]
kitae = "kitae.cli:main"

[tool.setuptools]
packages = ["kitae", "kitae.commands", "kitae.core", "kitae.build"]
