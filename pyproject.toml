[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitae"
version = "0.1.0"
description = "北へ。White Illumination 다국어화 파이프라인 (unpack/extract/build/font 도구 모음)"
requires-python = ">=3.9"
# Pillow: 글리프·이미지 변환 / capstone: SH-4 역어셈블(포맷 조사용, 선택)
dependencies = ["Pillow"]

[project.optional-dependencies]
re = ["capstone"]

[project.scripts]
kitae = "kitae.cli:main"

[tool.setuptools]
packages = ["kitae", "kitae.commands", "kitae.core", "kitae.build"]
